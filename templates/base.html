<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DeepTradeAlgo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark">DTA</span>
                <span>
                    <strong>DeepTradeAlgo</strong>
                    <small>Stock signal workbench</small>
                </span>
            </a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint in ['home', 'dashboard'] %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('realtime') }}" class="{% if request.endpoint == 'realtime' %}active{% endif %}">Quote</a>
                <a href="{{ url_for('healthz') }}">Health</a>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <span>Educational demo only. Not investment advice.</span>
            <span>Built with Flask, pandas, PyTorch, yfinance, and Plotly.</span>
        </footer>
    </div>
</body>
</html>
